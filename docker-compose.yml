# Local development database only. Credentials here are for local dev, never production.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greenvalley
    ports:
      - "5432:5432"
    volumes:
      - gv-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greenvalley"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gv-pgdata:
